spring.application.name=educloud-inscripciones

server.port=8080

spring.datasource.url=jdbc:h2:mem:educloud
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuración AWS S3 para almacenar los resúmenes de inscripción
aws.s3.bucket=${AWS_S3_BUCKET:educloud-inscripciones-2026}
aws.s3.region=${AWS_REGION:us-east-1}
aws.access.key=${AWS_ACCESS_KEY_ID}
aws.secret.key=${AWS_SECRET_ACCESS_KEY}
