name: Deploy EduCloud App

on:
  push:
    branches:
      - main

jobs:
  build-test-docker-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Compilar y ejecutar pruebas
        run: mvn clean test

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Construir y publicar imagen Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/educloud-inscripciones:latest

      - name: Desplegar en AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/educloud-inscripciones:latest
            docker stop educloud-app || true
            docker rm educloud-app || true
            docker run -d \
              --name educloud-app \
              -p 8080:8080 \
              -e ORACLE_DB_URL='${{ secrets.ORACLE_DB_URL }}' \
              -e ORACLE_DB_USER='${{ secrets.ORACLE_DB_USER }}' \
              -e ORACLE_DB_PASSWORD='${{ secrets.ORACLE_DB_PASSWORD }}' \
              ${{ secrets.DOCKER_USERNAME }}/educloud-inscripciones:latest
