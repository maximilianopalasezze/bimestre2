name: Implementar la aplicacion EduCloud

on:
  push:
    branches:
      - main

jobs:
  compilar-probar-docker-desplegar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compilar y ejecutar pruebas
        run: mvn clean package

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Construir y publicar imagen Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/educloud-inscripciones:latest

      - name: Crear archivo de llave SSH
        run: |
          echo "${{ secrets.EC2_KEY }}" > ec2_key.pem
          chmod 600 ec2_key.pem

      - name: Desplegar en AWS EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i ec2_key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            sudo docker pull maxem7240/educloud-inscripciones:latest
            sudo docker stop educloud-app || true
            sudo docker rm educloud-app || true
            sudo docker run -d --name educloud-app -p 8080:8080 maxem7240/educloud-inscripciones:latest
            sudo docker ps
          EOF
